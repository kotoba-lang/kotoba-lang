name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installed-kotoba-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrated CLJC kernel with released native Kotoba
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/kotoba-v0.7.1"
          cli_dir="$RUNNER_TEMP/kotoba-cli"
          mkdir -p "$release_dir" "$cli_dir"
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.7.1/kotoba-linux-amd64.tar.gz
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz.sha256" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.7.1/kotoba-linux-amd64.tar.gz.sha256
          (cd "$release_dir" && sha256sum -c kotoba-linux-amd64.tar.gz.sha256)
          tar -xzf "$release_dir/kotoba-linux-amd64.tar.gz" -C "$cli_dir"
          "$cli_dir/kotoba" compile lang/migration-pilots/demo-util.kotoba \
            --target web --output "$RUNNER_TEMP/demo-util.mjs" --json
          grep -q 'kotoba.artifact/provenance' "$RUNNER_TEMP/demo-util.mjs.manifest.edn"
          node scripts/test-installed-kotoba-pilot.mjs "$RUNNER_TEMP/demo-util.mjs"
          if "$cli_dir/kotoba" compile lang/migration-pilots/negative-eval.kotoba \
            --target web --output "$RUNNER_TEMP/forbidden.mjs" --json; then
            echo "expected forbidden eval to be rejected" >&2
            exit 1
          fi

  pure-product-examples:
    # T2.3: every pure-product example under examples/ compiles + KIR-executes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Amu sibling
        run: |
          git clone --depth 1 https://github.com/kotoba-lang/amu ../amu
          # Amu tip (dd943e08, 2026-08-25) fails to load:
          # kotoba/compiler/frontend.cljc references kir/host-stack-exhausted?
          # which is absent from the KIR that alias resolves. Pin to the last
          # tip that compiled this job (18564bce, #607, 2026-08-23).
          git -C ../amu fetch --depth 1 origin 18564bcec7b6c98414b3bcf53e7455be1d0f8154
          git -C ../amu checkout --detach 18564bcec7b6c98414b3bcf53e7455be1d0f8154
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Run pure-product examples (T2.3)
        env:
          KOTOBA_LANG_ROOT: ${{ github.workspace }}
        run: clojure -M:pure-product-examples

  # root ADR-2610092330 C2: one runner over this repository's conformance
  # manifest, on every backend amu drives (KIR, restricted ESM, browser Wasm,
  # admission). Exits non-zero when a required backend fails, when a recorded
  # deferral now passes (move it to :executed-by), or when no case ran.
  manifest-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f # main
        with:
          version: "1.243.0"
      - name: Checkout Amu sibling
        run: git clone --depth 1 https://github.com/kotoba-lang/amu ../amu
      - name: Install Amu
        working-directory: ../amu
        run: |
          npm ci
          node scripts/ci-dependency-prefetch.mjs --alias test
      - name: amu test --manifest
        run: ../amu/bin/amu test --manifest lang/conformance/manifest.edn

  nbb-suite:
    # The ClojureScript half of the suite (run-tests.cljk) on kbb, JVM-free
    # (root ADR-2610100200 group D). The frames tests recurse past V8's default
    # stack; Node refuses --stack-size in NODE_OPTIONS, so it goes through
    # KBB_NODE_FLAGS (kotoba#636). 195 tests measured 2026-10-10, 266 with the
    # loaders portable (kotoba.lang.repo-file); fewer fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoba-lang/setup-kbb@9df85c3572851df091ba0f42d31acccb8acd84f1
      - run: npm ci
      - name: run-tests.cljk on kbb
        env:
          KBB_NODE_FLAGS: --stack-size=7000
        run: |
          set -o pipefail
          kbb --backend sci --classpath "src:test:$(kbb -Spath -M:test)" run-tests.cljk 2>&1 | tee run-tests.log
          line=$(grep -E '^nbb: [0-9]+ tests, [0-9]+ passed, 0 failed, 0 errors$' run-tests.log)
          tests=$(echo "$line" | sed -E 's/^nbb: ([0-9]+) tests.*/\1/')
          test "$tests" -ge 266

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qualification siblings
        run: |
          git clone --depth 1 https://github.com/kotoba-lang/kotoba ../kotoba
          git clone --depth 1 https://github.com/kotoba-lang/amu ../amu
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-sema ../kotoba-sema
          # lang/operations.edn is checked against osaho's KIR and native
          # admission tables, read from source (root ADR-2610092330 R0)
          git clone --depth 1 https://github.com/kotoba-lang/osaho ../osaho
          # and kotoba-verifier's native document table (R3)
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-verifier ../kotoba-verifier
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-core-contracts ../kotoba-core-contracts
          # The sema checkout and :test dependency use the same merged frontend.
          # Its guest grammar copy matches lang/guest-grammar.edn (da68c3fa).
          # Catalog's comment-only rename remains an existing named deferral.
          git -C ../kotoba fetch --depth 1 origin 2cade224c9775874b289aefa91c760568af9e3a7
          git -C ../kotoba checkout --detach 2cade224c9775874b289aefa91c760568af9e3a7
          git -C ../amu fetch --depth 1 origin 249b9408d236d6766d04794d6a3cb04cb894b7dc
          git -C ../amu checkout --detach 249b9408d236d6766d04794d6a3cb04cb894b7dc
          git -C ../kotoba-sema fetch --depth 1 origin 8c7024cd8f6f9459b3e08a6aef6ab3870919ff99
          git -C ../kotoba-sema checkout --detach 8c7024cd8f6f9459b3e08a6aef6ab3870919ff99
          git -C ../kotoba-core-contracts fetch --depth 1 origin 5ce5b174feeca1cb24d8266b20dcd0a685500ebf
          git -C ../kotoba-core-contracts checkout --detach 5ce5b174feeca1cb24d8266b20dcd0a685500ebf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install nbb
        run: npm install -g nbb
      # The :test classpath is several hundred small git deps. A macOS runner
      # intermittently fails to reach github.com for one of them ("Failed to
      # connect ... after 75000 ms"; four main / PR runs on 2026-10-10), which
      # failed the job before a test ran. Cache the git libs and resolve them
      # with retries first, so a dropped connection costs a retry, not a run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gitlibs
            ~/.m2/repository
          key: clj-test-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clj-test-${{ runner.os }}-
      - name: Resolve the :test classpath (with retries)
        run: |
          for attempt in 1 2 3 4; do
            if clojure -P -M:test; then exit 0; fi
            echo "classpath resolution attempt $attempt failed; retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1
      - run: clojure -M:test
      - name: Compatibility report (T10.2)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          clojure -M:compatibility | tee artifacts/compatibility-report.edn
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: artifacts/compatibility-report.edn
      - name: Verify checked XMILE maturity result
        run: clojure -M:maturity --check
      - run: clojure -M:lint
      - run: bb scripts/check-cli-contract.bb lang/cli.edn
      - run: bb scripts/check-capability-values.bb
      - run: bb scripts/check-legacy-runtime-absence.bb
