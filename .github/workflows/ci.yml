name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installed-kotoba-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrated CLJC kernel with released native Kotoba
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/kotoba-v0.7.1"
          cli_dir="$RUNNER_TEMP/kotoba-cli"
          mkdir -p "$release_dir" "$cli_dir"
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.7.1/kotoba-linux-amd64.tar.gz
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz.sha256" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.7.1/kotoba-linux-amd64.tar.gz.sha256
          (cd "$release_dir" && sha256sum -c kotoba-linux-amd64.tar.gz.sha256)
          tar -xzf "$release_dir/kotoba-linux-amd64.tar.gz" -C "$cli_dir"
          "$cli_dir/kotoba" compile lang/migration-pilots/demo-util.kotoba \
            --target web --output "$RUNNER_TEMP/demo-util.mjs" --json
          grep -q 'kotoba.artifact/provenance' "$RUNNER_TEMP/demo-util.mjs.manifest.edn"
          node scripts/test-installed-kotoba-pilot.mjs "$RUNNER_TEMP/demo-util.mjs"
          if "$cli_dir/kotoba" compile lang/migration-pilots/negative-eval.kotoba \
            --target web --output "$RUNNER_TEMP/forbidden.mjs" --json; then
            echo "expected forbidden eval to be rejected" >&2
            exit 1
          fi

  pure-product-examples:
    # T2.3: every pure-product example under examples/ compiles + KIR-executes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Amu sibling
        run: |
          git clone --depth 1 https://github.com/kotoba-lang/amu ../amu
          # Amu tip (dd943e08, 2026-08-25) fails to load:
          # kotoba/compiler/frontend.cljc references kir/host-stack-exhausted?
          # which is absent from the KIR that alias resolves. Pin to the last
          # tip that compiled this job (18564bce, #607, 2026-08-23).
          git -C ../amu fetch --depth 1 origin 18564bcec7b6c98414b3bcf53e7455be1d0f8154
          git -C ../amu checkout --detach 18564bcec7b6c98414b3bcf53e7455be1d0f8154
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Run pure-product examples (T2.3)
        env:
          KOTOBA_LANG_ROOT: ${{ github.workspace }}
        run: clojure -M:pure-product-examples

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qualification siblings
        run: |
          git clone --depth 1 https://github.com/kotoba-lang/kotoba ../kotoba
          git clone --depth 1 https://github.com/kotoba-lang/amu ../amu
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-sema ../kotoba-sema
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-core-contracts ../kotoba-core-contracts
          # 63ca8ef is kotoba #490: guest-grammar sha256 21a6cdd matches this
          # repo's SSoT. kotoba main reverted it (#491) because other classpath
          # copies in that repo still lagged; this job only byte-compares the
          # vendored resource, so the matching commit is the correct pin.
          git -C ../kotoba fetch --depth 1 origin 63ca8ef0316691651e28f1e729ab004849d858b6
          git -C ../kotoba checkout --detach 63ca8ef0316691651e28f1e729ab004849d858b6
          git -C ../amu fetch --depth 1 origin 249b9408d236d6766d04794d6a3cb04cb894b7dc
          git -C ../amu checkout --detach 249b9408d236d6766d04794d6a3cb04cb894b7dc
          # kotoba-sema #15 (unmerged) restores both vendored authority copies
          # to this repo's SSoT bytes (guest-grammar 21a6cdd, catalog e2898e85).
          git -C ../kotoba-sema fetch --depth 1 origin d94c59edc4ed6f1a773c6b9c916a5d639dd66db4
          git -C ../kotoba-sema checkout --detach d94c59edc4ed6f1a773c6b9c916a5d639dd66db4
          git -C ../kotoba-core-contracts fetch --depth 1 origin 5ce5b174feeca1cb24d8266b20dcd0a685500ebf
          git -C ../kotoba-core-contracts checkout --detach 5ce5b174feeca1cb24d8266b20dcd0a685500ebf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install nbb
        run: npm install -g nbb
      - run: clojure -M:test
      - name: Compatibility report (T10.2)
        run: |
          mkdir -p artifacts
          clojure -M:compatibility | tee artifacts/compatibility-report.edn
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: artifacts/compatibility-report.edn
      - name: Verify checked XMILE maturity result
        run: clojure -M:maturity --check
      - run: clojure -M:lint
      - run: bb scripts/check-cli-contract.bb lang/cli.edn
      - run: bb scripts/check-capability-values.bb
      - run: bb scripts/check-legacy-runtime-absence.bb
