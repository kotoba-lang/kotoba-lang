name: Native site Linux observation

on:
  pull_request:
    paths:
      - '.github/workflows/native-site-linux.yml'
      - 'site/**'
      - '!site/native/BUILD.md'
      - 'test/site/native/**'
      - 'lang/**'
      - 'docs/search-index.edn'
      - 'docs/learn/amu/**'
      - 'docs/evidence/native-site-docs-candidate-20261106.json'
      - 'bench/public-*/latest.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-site-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-native-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [release-source, current-source]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record the actual Linux build environment
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/site-native-environment.json"
          import json, os, platform
          from pathlib import Path
          def read(path):
              p=Path(path)
              return p.read_text().strip() if p.is_file() else None
          print(json.dumps(dict(system=platform.system(),machine=platform.machine(),kernel=platform.release(),
              logicalCpus=os.cpu_count(),affinityCpus=len(os.sched_getaffinity(0)),
              physicalMemoryBytes=os.sysconf('SC_PHYS_PAGES')*os.sysconf('SC_PAGE_SIZE'),
              cgroupCpuMax=read('/sys/fs/cgroup/cpu.max'),cgroupMemoryMax=read('/sys/fs/cgroup/memory.max'),
              localeJobs=4),indent=2))
          PY
      - name: Fetch immutable native compiler and source inputs
        run: python3 site/native/fetch_linux_observation.py --profile '${{ matrix.profile }}' --output "$RUNNER_TEMP/site-native-inputs"
      - name: Observe native verdicts, refusals and actual producer compilation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 site/native/observe_linux.py --profile '${{ matrix.profile }}' --inputs "$RUNNER_TEMP/site-native-inputs" --output "$RUNNER_TEMP/site-linux-observation"
      - name: Retain observations, including failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-site-linux-observation-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/site-native-environment.json
            ${{ runner.temp }}/site-native-inputs/fetch.json
            ${{ runner.temp }}/site-linux-observation/receipt.json
            ${{ runner.temp }}/site-linux-observation/calls.json
            ${{ runner.temp }}/site-linux-observation/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate and qualify the complete Linux candidate
        if: matrix.profile == 'current-source'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 site/native/build_site.py --linux-inputs "$RUNNER_TEMP/site-native-inputs" \
            --compiler "$RUNNER_TEMP/site-native-inputs/amu.elf" \
            --libraries "$RUNNER_TEMP/site-native-inputs/lib" --grammar "$RUNNER_TEMP/site-native-inputs/grammar" \
            --output "$RUNNER_TEMP/site-linux-full" --jobs 4
          python3 site/native/check_docs.py --build "$RUNNER_TEMP/site-linux-full"
          python3 site/native/verify_site.py --build "$RUNNER_TEMP/site-linux-full"
          python3 site/native/compare_native_candidate.py --build "$RUNNER_TEMP/site-linux-full"
          python3 site/native/qualify_linux.py --build "$RUNNER_TEMP/site-linux-full" \
            --inputs "$RUNNER_TEMP/site-native-inputs" --libraries "$RUNNER_TEMP/site-native-inputs/lib" \
            --grammar "$RUNNER_TEMP/site-native-inputs/grammar"
          python3 site/native/check_release_failures.py --build "$RUNNER_TEMP/site-linux-full"
          python3 site/native/qualify_cloudflare_build.py --build "$RUNNER_TEMP/site-linux-full"
      - name: Retain full Linux candidate and private diagnostics
        if: always() && matrix.profile == 'current-source'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-site-linux-full
          path: ${{ runner.temp }}/site-linux-full
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
