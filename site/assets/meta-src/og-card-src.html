<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; }
  .stage { width: 1200px; height: 630px; position: relative; overflow: hidden; display: flex; align-items: center; }
  .ring { position: absolute; right: -240px; top: 50%; transform: translateY(-50%); }
  .text { position: relative; z-index: 1; padding-left: 88px; max-width: 860px; }
  .eyebrow { color: #0017c1; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 21px; margin: 0 0 20px; }
  h1 { color: #1d1d1f; font-size: 52px; line-height: 1.16; margin: 0 0 24px; font-weight: 800; }
  .lead { color: #55555c; font-size: 25px; line-height: 1.5; margin: 0; max-width: 700px; }
</style></head>
<body><div class="stage">
  <div class="text">
    <p class="eyebrow">A language AI agents can use, not abuse</p>
    <h1>AI writes freely.<br>Kotoba draws the boundary.</h1>
    <p class="lead">Post-quantum by default. Checked KIR. Content-addressed artifacts.</p>
  </div>
  <svg class="ring" id="ring" width="700" height="700" viewBox="0 0 200 200" aria-hidden="true"></svg>
</div>
<script>
(async () => {
  // Fetch the ring geometry from the built site page (single source of truth).
  const res = await fetch('file:///dev/null').catch(() => null);
})();
</script>
<script>
// Inline the same geometry as site/src/kotoba/site/hero.cljc (stroke arc only,
// sampled at build-time-equivalent points) so the card matches the live hero.
const PI = Math.PI, N = 360, GAP = 0.8, RING = 0.36;
const svg = document.getElementById('ring');
let circles = '';
for (let i = 0; i < N; i++) {
  const t = i / (N - 1);
  const a = (0.5 * PI + GAP / 2) + t * (2 * PI - GAP);
  const env = Math.sin(PI * t);
  const r = 0.028 + (0.060 - 0.028) * env;
  const d = 0.35 + 0.65 * env;
  const density = d * d;
  const x = 0.5 + RING * Math.cos(a), y = 0.5 + RING * Math.sin(a);
  circles += `<circle cx="${(x*200).toFixed(2)}" cy="${(y*200).toFixed(2)}" r="${(14*r).toFixed(2)}" fill="#0017c1" opacity="${(0.25 + 0.75*density).toFixed(2)}"/>`;
}
svg.innerHTML = circles;
</script>
</body></html>
